[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-notes-automation"
version = "0.1.0"
description = "Unattended pipeline that turns lecture transcripts and reference material into print-ready study-notes .docx files"
requires-python = ">=3.10"

# DEPENDENCIES ARE DECLARED ONCE, IN requirements.txt, AND READ FROM THERE.
# ---------------------------------------------------------------------------
# Both files exist because two DIFFERENT install paths are live, and neither
# reads the other's file (see requirements.txt's header for the full map):
#   * requirements.txt -> install.sh -> ~/.global_venv -> the nightly run
#   * pyproject.toml   -> `pip install git+...@develop` -> study-notes-runner
# The dependency list is identical for both, so it is maintained in exactly
# one place and pulled in here. Keeping two hand-written copies in sync is a
# guaranteed eventual drift.
#
# NOTE: this makes requirements.txt a BUILD INPUT -- it must be present when
# pip builds the package. A git-URL install clones the whole repo, so it is.
# If this repo ever publishes an sdist, requirements.txt must be included in
# it or the build will fail with "dynamic dependencies file not found".
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# PACKAGING NOTE FOR FUTURE MAINTAINERS
# ---------------------------------------------------------------------------
# This repo's code was never written with packaging in mind: config/settings.py
# is imported everywhere as a BARE top-level module ("import settings as
# config", not "from config import settings"), and it computes
# LOCAL_RUNTIME_ROOT as "two directories above my own __file__" -- i.e. it
# assumes config/, src/, and templates/ are always siblings under one root
# (true both for a git clone AND, given the layout below, for a pip install).
#
# `packages` below deliberately keeps config/, src/ (+ subpackages), and
# templates/ installed as siblings under the SAME root, preserving that
# exact nesting -- confirmed empirically (built a real wheel, installed it,
# and inspected LOCAL_RUNTIME_ROOT's resolved value) that this makes the
# skill-zip glob (config.LOCAL_RUNTIME_ROOT.glob(config.CLAUDE_SKILL_SOURCE_GLOB)
# in src/claude_cli_subprocess/stage2_cli.py and src/common/skill_retro.py)
# resolve correctly with ZERO changes to any of that path-computation logic.
#
# `config` has no __init__.py (matches the original repo -- it's just a
# directory containing settings.py, never imported as "config.settings").
# A consumer that wants the bare "import settings" to work needs to put
# the installed config/ directory itself onto sys.path before importing it
# -- exactly what src/main.py already does for a git clone. See
# run-claude-agent's bootstrap for the installed-package equivalent.
[tool.setuptools]
packages = [
    "config",
    "src",
    "src.agents",
    "src.direct_api",
    "src.claude_cli_subprocess",
    "src.common",
    "templates",
]
include-package-data = true

[tool.setuptools.package-dir]
config = "config"
src = "src"
templates = "templates"

[tool.setuptools.package-data]
templates = ["*.skill"]

[tool.pytest.ini_options]
# Confine collection to tests/. Without this, a bare `pytest` from the repo
# root recurses from rootdir and collects ANY top-level test_*.py -- which is
# how a scratch file named test_api.py (a hand-run Anthropic API repro, since
# deleted) became collectable. Its calls were all module-level, so collection
# alone would have fired real, billable API requests. Scratch scripts should
# not be able to run just because of where they sit.
testpaths = ["tests"]
